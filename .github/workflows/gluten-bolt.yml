name: Gluten Bolt Backend

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gluten-bolt-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gluten_sha: ${{ steps.inputs.outputs.gluten_sha }}
    steps:
      - name: Resolve Apache Gluten main for all jobs
        id: inputs
        shell: bash
        run: |
          read -r sha ref < <(git ls-remote --exit-code https://github.com/apache/gluten.git refs/heads/main)
          [[ "${sha}" =~ ^[0-9a-f]{40}$ && "${ref}" == refs/heads/main ]]
          echo "gluten_sha=${sha}" >> "${GITHUB_OUTPUT}"

  compatibility:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: '3.4'
            module: spark34
            scala: '2.13'
          - spark: '3.5'
            module: spark35
            scala: '2.12'
          - spark: '4.0'
            module: spark40
            scala: '2.13'
          - spark: '4.1'
            module: spark41
            scala: '2.13'
    steps:
      - name: Checkout the tested Bolt merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout resolved Apache Gluten main
        uses: actions/checkout@v6
        with:
          repository: apache/gluten
          ref: ${{ needs.prepare.outputs.gluten_sha }}
          path: gluten
          persist-credentials: false
      - name: Apply declared Gluten compatibility patches
        run: |
          source .github/scripts/gluten_ci.sh
          ci_apply_patches
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: gluten/**/pom.xml
      - name: Compile Bolt backend, Delta and Spark UT support
        working-directory: gluten
        env:
          SPARK_PROFILE: ${{ matrix.spark }}
          SPARK_MODULE: ${{ matrix.module }}
          SCALA_PROFILE: ${{ matrix.scala }}
        run: |
          set -o pipefail
          storage_profiles=()
          if [[ "${SPARK_PROFILE}" == "3.4" ]]; then
            storage_profiles=(-Piceberg -Piceberg-test)
          fi
          ./build/mvn install -Pbackends-bolt -Pdelta -Pspark-ut -Pfast-build \
            "-Pspark-${SPARK_PROFILE}" "-Pscala-${SCALA_PROFILE}" -Pjava-17 \
            "${storage_profiles[@]}" \
            -Dmaven.compiler.release=17 -DskipTests=true \
            -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false \
            -pl "backends-bolt,gluten-ut/${SPARK_MODULE}" -am 2>&1 | tee compatibility.log
      - name: Preserve compatibility compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gluten-bolt-compile-${{ matrix.spark }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            gluten/compatibility.log
            .ci/gluten-bolt/
          if-no-files-found: error
          retention-days: 14

  integration:
    needs: prepare
    runs-on: ${{ fromJSON(vars.BOLT_GLUTEN_CI_RUNNER || '["self-hosted", "medium"]') }}
    timeout-minutes: 1440
    container:
      image: ${{ vars.BOLT_GLUTEN_CI_IMAGE || 'bolt-registry:5000/bolt-ci:20260921' }}
      options: --user root --init
    services:
      conanserver:
        # Each CI host builds its own registry images; digest overrides must be
        # published to every selected runner's registry.
        image: ${{ vars.BOLT_GLUTEN_CI_CONAN_IMAGE || 'bolt-registry:5000/conan-server:latest' }}
        volumes:
          - /data/conan-server-data:/var/conan/data
    env:
      CI_NUM_THREADS: '16'
      IN_CI: '1'
      GLUTEN_EXCLUDED_TAGS: org.apache.gluten.tags.UDFTest,org.apache.gluten.tags.EnhancedFeaturesTest,org.apache.gluten.tags.CudfTest,org.apache.gluten.tags.SkipTest
    defaults:
      run:
        shell: bash
    steps:
      - name: Locate Conan cache in the container workspace
        run: echo "CONAN_HOME=${GITHUB_WORKSPACE}/.ci/conan" >> "$GITHUB_ENV"
      - name: Checkout the tested Bolt merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout resolved Apache Gluten main
        uses: actions/checkout@v6
        with:
          repository: apache/gluten
          ref: ${{ needs.prepare.outputs.gluten_sha }}
          path: gluten
          persist-credentials: false
      - name: Apply declared Gluten compatibility patches
        run: |
          source .github/scripts/gluten_ci.sh
          ci_apply_patches
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Conan and Bolt dependencies
        uses: ./.github/actions/bolt-build-base
      - name: Provision Gluten Spark test environment
        run: |
          source .github/scripts/gluten_ci.sh
          ci_init
          apt-get update
          apt-get install -y --no-install-recommends jq
          python3 -m pip install --disable-pip-version-check \
            setuptools==77.0.3 Cython==3.3.0 numpy==1.26.4 \
            "pyspark==${SPARK_VERSION}" pandas==2.2.3 pyarrow==20.0.0
          command -v shasum
          resources="${BOLT_ROOT}/.ci/spark35"
          bash "${GLUTEN_DIR}/.github/workflows/util/install-spark-resources.sh" \
            "${SPARK_PROFILE}" "${resources}"
          export BOLT_GLUTEN_SPARK_HOME="${resources}/shims/spark35/spark_home"
          # Gluten keeps jars in the source assembly layout; Spark's launchers
          # also need the binary distribution layout.
          ln -s "assembly/target/scala-${SCALA_VERSION}/jars" \
            "${BOLT_GLUTEN_SPARK_HOME}/jars"
          ci_spark_environment
          printf 'BOLT_GLUTEN_SPARK_HOME=%s\nSPARK_HOME=%s\nPYTHONPATH=%s\nPYSPARK_PYTHON=%s\n' \
            "${BOLT_GLUTEN_SPARK_HOME}" "${SPARK_HOME}" "${PYTHONPATH}" \
            "$(command -v python3)" >> "${GITHUB_ENV}"
      - name: Build and export the candidate Bolt package and Gluten native backend
        id: build
        run: |
          source .github/scripts/gluten_ci.sh
          ci_init
          BOLT_BUILD_VERSION="ci-$(git -C "${BOLT_ROOT}" rev-parse HEAD)"
          GLUTEN_BUILD_VERSION="ci-$(git -C "${GLUTEN_DIR}" rev-parse HEAD)"
          exec > >(tee "${GLUTEN_REPORTS_DIR}/build.log") 2>&1
          java -version
          c++ --version
          conan --version
          cmake --version
          conan profile show
          options=(-o "bolt/*:spark_compatible=True" -o "bolt/*:enable_testutil=True"
            -o "bolt/*:shared=False" -o "bolt/*:enable_hdfs=False"
            -o "bolt/*:enable_s3=False" -o "bolt/*:enable_asan=False")
          profile=(-pr:h default)
          if [[ -f scripts/conan/bolt.profile ]]; then
            profile+=(-pr:h "${BOLT_ROOT}/scripts/conan/bolt.profile")
          fi
          printf -v profile_args '%q ' "${profile[@]}"
          make release_spark_with_test BOLT_CONAN_CONFIGURE_ONLY=1 \
            "BUILD_VERSION=${BOLT_BUILD_VERSION}" "CONAN_OVERRIDE=${options[*]}" \
            "CONAN_HOST_PROFILE_ARGS=${profile_args}"
          cmake --build --preset conan-release --target bolt_engine bolt_testutils_static \
            --parallel "${CI_NUM_THREADS}"
          profile+=(-s build_type=Release)
          conan export-pkg . --name=bolt "--version=${BOLT_BUILD_VERSION}" \
            "${profile[@]}" "${options[@]}" -c bolt/*:tools.build:skip_test=False \
            --format=json > "${GLUTEN_REPORTS_DIR}/bolt-export.json"
          export BOLT_BUILD_VERSION
          cd "${GLUTEN_DIR}/cpp"
          common=(. --name=gluten "--version=${GLUTEN_BUILD_VERSION}"
            "${profile[@]}" "${options[@]}" -o "gluten/*:shared=True"
            -o "gluten/*:build_tests=True" -o "gluten/*:enable_hdfs=False"
            -o "gluten/*:enable_s3=False" -o "gluten/*:enable_asan=False"
            -c arrow/*:tools.build:download_source=True --lockfile=)
          conan install "${common[@]}" --build=missing "--build=~bolt/*" --format=json \
            > "${GLUTEN_REPORTS_DIR}/gluten-install.json"
          # Gluten must consume the exact Bolt binary exported above, without rebuilding it.
          jq -e --slurpfile exported "${GLUTEN_REPORTS_DIR}/bolt-export.json" '
            [.graph.nodes[] | select(.name == "bolt" and .context == "host")] as $actual |
            [$exported[0].graph.nodes[] | select(.name == "bolt" and .context == "host")] as $expected |
            ($actual | length) == 1 and ($expected | length) == 1 and
            $actual[0].binary == "Cache" and
            ($actual[0] | {ref, package_id, prev}) == ($expected[0] | {ref, package_id, prev})
          ' "${GLUTEN_REPORTS_DIR}/gluten-install.json"
          cmake --preset conan-release
          cmake --build --preset conan-release --parallel "${CI_NUM_THREADS}"
          cd "${GLUTEN_DIR}"
          bash dev/build_bolt_arrow.sh
          ci_runtime "${MVN[@]}" install -Pspark-ut \
            -pl backends-bolt,gluten-ut/spark35 -am -DskipTests=true
          (cd cpp/build/package/bolt/linux/amd64 && sha256sum *.so) \
            > "${GLUTEN_REPORTS_DIR}/native.sha256"
          (cd backends-bolt/target/scala-${SCALA_VERSION}/classes/linux/amd64 && \
            sha256sum -c "${GLUTEN_REPORTS_DIR}/native.sha256")
      - name: Run native CTest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          source .github/scripts/gluten_ci.sh
          ci_init
          output="${GLUTEN_REPORTS_DIR}/native"
          mkdir -p "${output}"
          : > "${output}/run.log"
          for library in "${GLUTEN_DIR}"/cpp/build/releases/*.so; do
            ci_run "${output}/run.log" ci_runtime ldd "${library}"
          done
          if grep -q 'not found' "${output}/run.log"; then exit 1; fi
          rm -f "${output}/TEST-native.xml"
          ci_run "${output}/run.log" ci_runtime ctest \
            --test-dir "${GLUTEN_DIR}/cpp/build/Release" --no-tests=error \
            --output-on-failure --output-junit "${output}/TEST-native.xml" \
            --timeout 7200 -j "${CI_NUM_THREADS}"
      - name: Run backend JVM and isolated Delta suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          source .github/scripts/gluten_ci.sh
          ci_init
          ci_spark_environment
          output="${GLUTEN_REPORTS_DIR}/jvm"
          mkdir -p "${output}"
          cd "${GLUTEN_DIR}"
          CI_GROUP=blacklist CI_SUITES=org.apache.gluten.utils.GlutenTestBlacklistSuite \
            ci_maven_test jvm gluten-ut/test "${MVN[@]}" test -Pspark-ut
          ci_runtime "${MVN[@]}" test-compile -pl backends-bolt
          ci_runtime "${MVN[@]}" dependency:build-classpath -pl backends-bolt \
            -DincludeScope=test "-Dmdep.outputFile=${output}/test-classpath.txt"
          classes="${GLUTEN_DIR}/backends-bolt/target/scala-${SCALA_VERSION}"
          "${JAVA_HOME}/bin/java" --class-path \
            "${classes}/test-classes:${classes}/classes:$(cat "${output}/test-classpath.txt")" \
            "${BOLT_ROOT}/.github/scripts/DiscoverGlutenSuites.java" \
            "${output}/discovered-suites.txt" "${classes}/test-classes" "${classes}/classes"
          ordinary=() delta=()
          while IFS= read -r suite; do
            if [[ "${suite}" == org.apache.spark.sql.delta.* ]]; then
              delta+=("${suite}")
            else
              ordinary+=("${suite}")
            fi
          done < "${output}/discovered-suites.txt"
          ((${#ordinary[@]} > 0))
          failed=0
          selected="$(IFS=,; printf '%s' "${ordinary[*]}")"
          CI_GROUP=backend CI_SUITES="${selected}" ci_maven_test jvm backends-bolt \
            "${MVN[@]}" test "-DtagsToExclude=${GLUTEN_EXCLUDED_TAGS}" \
            "-DargLine=-Dspark.test.home=${SPARK_HOME}" || failed=1
          for suite in "${delta[@]}"; do
            CI_GROUP="${suite}" CI_SUITES="${suite}" ci_maven_test jvm backends-bolt \
              "${MVN[@]}" scalatest:test "-DtagsToExclude=${GLUTEN_EXCLUDED_TAGS}" \
              "-DargLine=-Dspark.test.home=${SPARK_HOME}" || failed=1
          done
          exit "${failed}"
      - name: Run Spark 3.5 SQL unit test groups
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          source .github/scripts/gluten_ci.sh
          ci_init
          ci_spark_environment
          groups=(
            org.apache.spark.sql.streaming,org.apache.spark.GlutenSortShuffleSuite,org.apache.gluten
            org.apache.spark.sql.execution,org.apache.spark.sql.catalyst,org.apache.spark.sql.errors,org.apache.spark.sql.extension
            org.apache.spark.sql.GlutenSQL,org.apache.spark.sql.Gluten,org.apache.spark.sql.connector,org.apache.spark.sql.sources,org.apache.spark.sql.hive,org.apache.spark.sql.gluten,org.apache.spark.sql.shim
          )
          excluded="org.apache.spark.tags.ExtendedSQLTest,org.apache.spark.tags.SlowHiveTest,${GLUTEN_EXCLUDED_TAGS}"
          failed=0
          for group in 1 2 3; do
            ci_maven_test "spark-${group}" gluten-ut/spark35 "${MVN[@]}" test -Pspark-ut \
              "-DwildcardSuites=${groups[$((group-1))]}" "-DtagsToExclude=${excluded}" \
              "-DargLine=-Dspark.test.home=${SPARK_HOME}" || failed=1
          done
          exit "${failed}"
      - name: Run Extended SQL and Slow Hive tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          source .github/scripts/gluten_ci.sh
          ci_init
          ci_spark_environment
          failed=0
          for tag in ExtendedSQLTest SlowHiveTest; do
            stage=extended
            [[ "${tag}" != SlowHiveTest ]] || stage=slow-hive
            ci_maven_test "${stage}" gluten-ut/spark35 "${MVN[@]}" test -Pspark-ut \
              "-DtagsToInclude=org.apache.spark.tags.${tag}" \
              "-DtagsToExclude=${GLUTEN_EXCLUDED_TAGS}" \
              "-DargLine=-Dspark.test.home=${SPARK_HOME}" || failed=1
          done
          exit "${failed}"
      - name: Compare TPC-H and TPC-DS against vanilla Spark
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          source .github/scripts/gluten_ci.sh
          ci_init
          cd "${GLUTEN_DIR}"
          ci_runtime "${MVN[@]}" install -DskipTests=true
          cd tools/gluten-it
          ci_runtime "${GLUTEN_DIR}/build/mvn" -ntp install \
            "-Pspark-${SPARK_PROFILE}" "-Pjava-${JDK_VERSION}"
          bundles=()
          for jar in "${GLUTEN_DIR}"/package/target/gluten-package-*.jar; do
            case "${jar}" in
              *-sources.jar|*-test-sources.jar|*-tests.jar|*-javadoc.jar|*-"${SPARK_PROFILE}".jar) continue ;;
            esac
            bundles+=("${jar}")
          done
          ((${#bundles[@]} == 1))
          cmp "${bundles[0]}" "package/target/lib/${bundles[0]##*/}"
          failed=0
          for kind in h ds; do
            stage="tpc-${kind}"
            output="${GLUTEN_REPORTS_DIR}/${stage}"
            mkdir -p "${output}"
            : > "${output}/run.log"
            GLUTEN_IT_JVM_ARGS=-Xmx6G ci_run "${output}/run.log" ci_runtime \
              bash sbin/gluten-it.sh queries-compare --local --preset=velox \
              --baseline-preset=vanilla "--benchmark-type=${kind}" --error-on-memleak \
              --explain --off-heap-size=10g -s=1.0 --threads=16 --iterations=1 || failed=1
          done
          exit "${failed}"
      - name: Run Spark 4.0 and 4.1 compatibility subsets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          source .github/scripts/gluten_ci.sh
          ci_init
          ci_profile_lock exclusive
          expressions=(ArithmeticExpression BitwiseExpressions ConditionalExpression
            LiteralExpression NullExpressions Predicate)
          suites=org.apache.spark.sql.GlutenBoltBackendSmokeSuite
          for name in "${expressions[@]}"; do
            suites+=",org.apache.spark.sql.catalyst.expressions.Gluten${name}Suite"
          done
          failed=0
          for profile in 4.0 4.1; do
            (
              stage="spark${profile/./}"
              ci_set_maven "${profile}" || exit "$?"
              export SPARK_SCALA_VERSION=2.13
              unset GLUTEN_TEST_BLACKLIST
              cd "${GLUTEN_DIR}" || exit "$?"
              ci_run "${GLUTEN_REPORTS_DIR}/${stage}-compile.log" ci_runtime \
                "${MVN[@]}" clean install -Pspark-ut \
                -pl "backends-bolt,gluten-ut/${stage}" -am -DskipTests=true || exit "$?"
              (cd backends-bolt/target/scala-2.13/classes/linux/amd64 && \
                sha256sum -c "${GLUTEN_REPORTS_DIR}/native.sha256") || exit "$?"
              CI_GROUP=backend \
                CI_SUITES=org.apache.gluten.execution.BoltParquetDataTypeValidationSuite,org.apache.gluten.execution.BoltOrcDataTypeValidationSuite \
                ci_maven_test "${stage}" backends-bolt "${MVN[@]}" test -Pspark-ut \
                  -DargLine=-Dspark.sql.ansi.enabled=false || exit "$?"
              CI_GROUP=ut CI_SUITES="${suites}" ci_maven_test "${stage}" \
                "gluten-ut/${stage}" "${MVN[@]}" test -Pspark-ut
            ) || failed=1
          done
          exit "${failed}"
      - name: Preserve reports, source identities and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gluten-bolt-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .ci/gluten-bolt/
            gluten/**/target/*reports/TEST-*.xml
            gluten/**/target/*.log
            gluten/**/hs_err_*.log
            gluten/**/core.*
            /var/log/java/hs_err_*.log
            gluten/cpp/build/Release/Testing/Temporary/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native artifacts from this run
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gluten-bolt-native-${{ github.sha }}-${{ github.run_attempt }}
          path: gluten/cpp/build/releases/
          if-no-files-found: error
          retention-days: 2

  gluten-bolt-check:
    name: gluten-bolt-check
    needs: [prepare, compatibility, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every integration job to succeed
        env:
          REQUIRED_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "${REQUIRED_RESULTS}" = "success success success"
